server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions4.yaml 

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vulnerableapp_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: vulnerableapp
          env: development
          __path__: /var/log/applogs/*.txt
    
    pipeline_stages:
      - regex:
          expression: '(?P<Security>EVENTO AUTH|inválidas)'
      - labels:
          Security:
      - regex:
          expression: '(?P<Application>Error|Exception)'
      - labels:
          Application:
      - regex:
          expression: '(?P<Audit>\[INF\]|Inicio)'
      - labels:
          Audit: