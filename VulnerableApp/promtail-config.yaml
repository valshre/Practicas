server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml 

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vulnerableapp_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: vulnerableapp
          env: development
          __path__: /var/log/applogs/*.txt

    pipeline_stages:
      - match:
          selector: '{job="vulnerableapp"}'
          stages:
            - regex:
                expression: '(?P<Security>Security)|(?P<Audit>Audit)'
            - labels:
                Security:
                Audit: